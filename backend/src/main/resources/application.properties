spring.application.name=schedula-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/schedula}
spring.datasource.username=${DB_USERNAME:schedula}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Bootstrap only creates an absent RH account; never overwrites passwords.
schedula.admin.username=${SCHEDULA_ADMIN_USERNAME:}
schedula.admin.password=${SCHEDULA_ADMIN_PASSWORD:}
schedula.timezone=America/Fortaleza
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:pt_BR}
whatsapp.enabled=${WHATSAPP_ENABLED:false}

# Single-instance login throttle; forwarded headers are never trusted as client identity.
schedula.login.max-attempts=${LOGIN_MAX_ATTEMPTS:10}
schedula.login.window-seconds=${LOGIN_WINDOW_SECONDS:300}
schedula.login.max-addresses=${LOGIN_MAX_ADDRESSES:10000}
server.forward-headers-strategy=none
