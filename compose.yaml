services:
  postgres:
    image: postgres:17-alpine
    container_name: schedula-postgres
    environment:
      POSTGRES_DB: schedula
      POSTGRES_USER: schedula
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedula -d schedula"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
